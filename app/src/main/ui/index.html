<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" type="text/css" href="/app/css/index.css" />
	<link rel="stylesheet" type="text/css" href="/app/css/navbar.css" />
	<link rel="stylesheet" type="text/css" href="/app/css/search.css" />
	<link rel="stylesheet" type="text/css" href="/app/css/results.css" />
	<link rel="stylesheet" type="text/css" href="/app/css/attendance.css" />
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Gudea:ital,wght@0,400;0,700;1,400&display=swap"
		rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Koulen&display=swap" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
	<title>Home</title>
</head>

<body>
	<header>
		<nav class="navbar">
			<img class="navbar__left" src="/app/svg/menu.svg" />
			<h2 class="navbar__middle">atten</h3>
				<ul class="navbar__right">
					<li><a class="navbar__link" href="/app/batch.html">Batch</a></li>
					<li><a class="navbar__link" href="https://github.com/bakageddy">About Me</a></li>
				</ul>
		</nav>
	</header>

	<main>
		<section class="search">
			<form class="search__form" method="GET" action="/app/api/teacher/search">
				<input id="search__teacher__id" class="search__element" name="teacherid" type="number"
					placeholder="Teacher ID" />
				<input id="search__teacher__name" class="search__element" name="teachername" type="text"
					placeholder="Teacher Name" />
			</form>

			<form class="search__form" method="GET" action="/app/api/subject/search">
				<input id="search__subject__id" class="search__element" name="subjectid" type="number"
					placeholder="Subject ID" />
				<input id="search__subject__code" class="search__element" name="subjectcode" type="text"
					placeholder="Subject Code" />
				<input id="search__subject__name" class="search__element" name="name" type="text"
					placeholder="Subject Name" />
			</form>

			<form class="search__form" method="GET" action="/app/api/student/search">
				<input id="search__student__id" class="search__element" name="rollno" type="number"
					placeholder="Student ID" />
				<input id="search__student__name" class="search__element" name="pattern" type="text"
					placeholder="Student Name" />
			</form>

			<form class="search__form" method="GET" action="/app/api/batch/search">
				<input id="search__batch__id" class="search__element" name="id" type="number" placeholder="Batch ID"/>
				<input id="search__batch__name" class="search__element" name="name" type="text" placeholder="Batch Name"/>
				<input id="search__batch__teacherid" class="search__element" name="teacherid" type="number" placeholder="Batch Owner ID / Teacher ID"/>
			</form>
		</section>

		<section class="results" id="result_display">
		</section>

		<section class="attendance">
			<div class="attendance__group">
				<h2>Set Attendance</h2>
				<form class="attendance__form"  action="/app/api/attendance" method="POST">
					<input class="input__element attendance__input__element" id="attendance__input__rollno"
						placeholder="Student Roll Number" name="rollno" type="number" />
					<input class="input__element attendance__input__element" id="attendance__input__teacherid" placeholder="Teacher ID"
						name="teacherid" type="number" />
					<input class="input__element attendance__input__element" id="attendance__input__subjectid" placeholder="Subject ID"
						name="subjectid" type="number" />
					<input class="input__element attendance__input__element" id="attendance__input__date" placeholder="Date" name="day"
						type="date" />
					<select name="period" class="input__element attendance__input__element" id="attendance__input__period">
						<option value="I">I</option>
						<option value="II">II</option>
						<option value="III">III</option>
						<option value="IV">IV</option>
						<option value="V">V</option>
						<option value="VI">VI</option>
						<option value="VII">VII</option>
						<option value="VIII">VIII</option>
					</select>
					<div class="attendance__input__submit__group">
						<button class="submit__button attendance__input__element" formaction="/app/api/attendance/"
							formmethod="post" type="submit">Set</button>
						<button class="submit__button attendance__input__element"
							onclick="attendanceFormDelete(); return false;" type="submit">Delete</button>
					</div>
				</form>
			</div>
			<div class="batch__group">
				<form class="batch__form" action="/app/api/batch" method="POST">
					<input class="batch__input__element input__element" id="batch__input__batchid" placeholder="Batch ID"
						name="id" type="number" />
					<input class="batch__input__element input__element" id="batch__input__teacherid"
						placeholder="Teacher ID" name="teacherid" type="number" />
					<input class="batch__input__element input__element" id="batch__input__subjectid"
						placeholder="Subject ID" name="subjectid" type="number" />

					<input class="batch__input__element input__element" id="batch__input__day" placeholder="Date"
						name="date" type="date" />
					<select name="period" class="batch__input__element input__element" id="batch__input__period" placeholder="Period">
						<option value="I">I</option>
						<option value="II">II</option>
						<option value="III">III</option>
						<option value="IV">IV</option>
						<option value="V">V</option>
						<option value="VI">VI</option>
						<option value="VII">VII</option>
						<option value="VIII">VIII</option>
					</select>
					<button class="submit__button batch__button" type="submit">Set</button>
				</form>
			</div>
		</section>
	</main>

	<footer>
	</footer>


	<script src="/app/js/attendance.js"></script>
	<script src="/app/js/student.js"></script>
	<script src="/app/js/subject.js"></script>
	<script src="/app/js/batch_search.js"></script>
	<script src="/app/js/teacher.js"></script>
</body>

</html>
