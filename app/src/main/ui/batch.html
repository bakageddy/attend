<!DOCTYPE html>
<html>

<head>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Gudea:ital,wght@0,400;0,700;1,400&display=swap"
		rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Koulen&display=swap" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
	<link rel="stylesheet" type="text/css" href="/app/css/navbar.css" />
	<link rel="stylesheet" type="text/css" href="/app/css/results.css" />
	<link rel="stylesheet" type="text/css" href="/app/css/index.css" />
	<link rel="stylesheet" type="text/css" href="/app/css/batch/batch.css" />
	<title>Batch - Attend</title>
</head>

<body>
	<header>
		<nav class="navbar">
			<img class="navbar__left" src="/app/svg/menu.svg" />
			<h2 class="navbar__middle">atten</h3>
				<ul class="navbar__right">
					<li><a class="navbar__link" href="/app/index.html">Home</a></li>
					<li><a class="navbar__link" href="https://github.com/bakageddy">About Me</a></li>
				</ul>
		</nav>
	</header>

	<main class="batch">
		<div class="batch__crud__group">
			<section class="batch__crud">
				<div class="batch__crud__form">
					<div class="batch__crud__input__group">
						<input id="batch__crud__batchid" class="input__element batch__crud__input__element"
							type="number" name="batchid" placeholder="Batch ID">
						<input id="batch__crud__name" class="input__element batch__crud__input__element" type="text"
							name="name" placeholder="Batch Name" />
						<input id="batch__crud__teacherid" class="input__element batch__crud__input__element"
							type="number" name="teacherid" placeholder="Teacher ID" />
					</div>

					<div class="batch__crud__button__group">
						<button id="batch__crud__create__button" class="submit__button batch__crud__button"
							onclick="handle_batch_create(); return false;">
							Create
						</button>
						<button id="batch__crud__delete__button" class="submit__button batch__crud__button"
							onclick="handle_batch_delete(); return false;">
							Delete
						</button>
					</div>
				</div>
			</section>

			<section class="batch__data__crud">
				<div class="batch__search__input__group">
					<input id="batch__data__studentid__search" class="input__element" placeholder="StudentID"
						type="number" name="rollno" />
					<input id="batch__data__studentname__search" class="input__element" placeholder="Student Name"
						name="name" />
				</div>
				<div class="batch__search__input__group">
					<input id="batch__data__batchid__search" class="input__element" placeholder="BatchID" name="batchid"
						type="number" />
					<input id="batch__data__batchname__search" class="input__element" placeholder="BatchName"
						name="batchname" type="text" />
				</div>
			</section>
		</div>

		<section id="search__results" class="results batch__data__results">
			<!-- GRID BASED DRAG and DROPPABLE RESULTS -->
		</section>

		<section class="batch__data__scratchpad">
			<input id="batch__data__scratchpad__batchid" class="input__element" placeholder="BatchID" name="batchid" />
			<input id="batch__data__scratchpad__teacherid" class="input__element" placeholder="TeacherID"
				name="teacherid" />

			<div id="student_dropzone" class="batch__data__selected__students batch__data__drop__zone">
				<h4>Drag and Drop Students</h4>
			</div>

			<div class="batch__data__button__group">
				<button id="batch__data__crud__create__button" class="batch__data__button submit__button">
					Add to Batch
				</button>
				<button id="batch__data__crud__delete__button" class="batch__data__button submit__button">
					Remove from Batch
				</button>
			</div>
		</section>
	</main>
	<footer>
	</footer>
	<script src="/app/js/batch/batch_search.js"></script>
	<script src="/app/js/batch/student_search.js"></script>
</body>

</html>
