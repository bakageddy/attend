<!DOCTYPE html>
<html>

<head>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Gudea:ital,wght@0,400;0,700;1,400&display=swap"
		rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Koulen&display=swap" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
	<link rel="stylesheet" type="text/css" href="/app/css/navbar.css" />
	<link rel="stylesheet" type="text/css" href="/app/css/attendance.css" />
	<link rel="stylesheet" type="text/css" href="/app/css/index.css" />
	<link rel="stylesheet" type="text/css" href="/app/css/batch/batch.css" />
	<title>Batch - Attend</title>
</head>

<body>
	<header>
		<nav class="navbar">
			<img class="navbar__left" src="/app/svg/menu.svg" />
			<h2 class="navbar__middle">atten</h3>
				<ul class="navbar__right">
					<li><a class="navbar__link" href="/app/index.html">Home</a></li>
					<li><a class="navbar__link" href="https://github.com/bakageddy">About Me</a></li>
				</ul>
		</nav>
	</header>

	<main class="batch">
		<section class="batch__crud">
			<div class="batch__crud__form">
				<div class="batch__crud__input__group">
					<input id="batch__crud__batchid" class="input__element batch__crud__input__element" type="number"
						name="batchid" placeholder="Batch ID">
					<input id="batch__crud__name" class="input__element batch__crud__input__element" type="text"
						name="name" placeholder="Batch Name" />
					<input id="batch__crud__teacherid" class="input__element batch__crud__input__element" type="number"
						name="teacherid" placeholder="Teacher ID" />
				</div>

				<div class="batch__crud__button__group">
					<button id="batch__crud__create__button" class="submit__button batch__crud__button"
						onclick="handle_batch_create(); return false;">
						Create
					</button>
					<button id="batch__crud__delete__button" class="submit__button batch__crud__button"
						onclick="handle_batch_delete(); return false;">
						Delete
					</button>
				</div>
			</div>
		</section>

		<section class="batch__data__crud">
			<div>
				<input id="batch__data__studentid__search" class="input__element" placeholder="StudentID" name="rollno"/>
				<input id="batch__data__studentname__search" class="input__element" placeholder="Student Name" name="name"/>
			</div>
			<div>
				<input id="batch__data__teacherid__search" class="input__element" placeholder="TeacherID" name="teacherid"/>
				<input id="batch__data__teachername__search" class="input__element" placeholder="Teacher Name" name="teachername"/>
			</div>
		</section>

		<section class="batch__data__results">
			<!-- GRID BASED DRAG and DROPPABLE RESULTS -->
		</section>

		<section class="batch__data__scratchpad">
			<input class="input__element" placeholder="BatchID" name="batchid"/>

			<div class="batch__data__selected__students">
			</div>

			<div class="batch__data__button__group">
				<button class=" submit__button">Add to Batch</button>
				<button class=" submit__button">Remove from Batch</button>
			</div>
		</section>
	</main>
	<footer>
	</footer>
</body>

</html>
